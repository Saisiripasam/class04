<!DOCTYPE html>
<html>
<head>
<title>Admission Form</title>
<style>
body{font-family:Arial;background:#eee}
form{max-width:500px;margin:30px auto;padding:20px;background:white;
display:grid;grid-template-columns:1fr 1fr;gap:10px}
input,select,button{padding:10px}
h2,.full{grid-column:1/3}
button{background:blue;color:white;border:0}
@media(max-width:600px){
form{grid-template-columns:1fr}
h2,.full{grid-column:1}
}
</style>
</head>
<body>

<form>
<h2>Student Admission Form</h2>
<input placeholder="First Name">
<input placeholder="Last Name">
<input placeholder="Email">
<input placeholder="Phone">
<select><option>Select Course</option>
<option>BCA</option><option>B.Tech</option></select>
<input type="date">
<input class="full" placeholder="Address">
<button class="full">Submit</button>
</form>

</body>
</html>
